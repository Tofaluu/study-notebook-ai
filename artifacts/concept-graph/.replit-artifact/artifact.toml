kind = "web"
previewPath = "/"
title = "Study Notebook"
description = "An AI study companion that explains lecture PDFs and concept questions in a familiar chat format, with technical terms linked to separate beginner-friendly explanations."
version = "1.0.0"
id = "artifacts/concept-graph"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18379

[services.development]
run = "pnpm --filter @workspace/concept-graph run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/concept-graph", "run", "build" ]
serve = "static"
publicDir = "artifacts/concept-graph/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18379"
BASE_PATH = "/"
