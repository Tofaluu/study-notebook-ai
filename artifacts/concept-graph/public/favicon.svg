<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- The notebook mark: matches the in-app Sidebar NotebookMark in both light and dark mode -->
  <style>
    /* Default (Light Mode): white fill, black outline, green bookmark */
    :root {
      --cover-stroke: #1c2128;
      --cover-fill: #ffffff;
      --ribbon: #126e61;
    }
    /* Dark Mode: black fill, white outline, luminous green bookmark */
    @media (prefers-color-scheme: dark) {
      :root {
        --cover-stroke: #f8fafc;
        --cover-fill: #161719;
        --ribbon: #4ec5b0;
      }
    }
    .cover {
      stroke: var(--cover-stroke);
      fill: var(--cover-fill);
      stroke-width: 1.75;
    }
    .spine {
      stroke: var(--cover-stroke);
      stroke-width: 1.75;
    }
    .ribbon {
      fill: var(--ribbon);
      stroke: var(--ribbon);
      stroke-width: 1.75;
    }
  </style>
  <rect class="cover" x="4.5" y="2.5" width="15" height="19" rx="2.5" />
  <path class="spine" d="M8.5 2.5v19" />
  <path class="ribbon" d="M13.5 2.5v8l2-1.6 2 1.6v-8z" />
</svg>